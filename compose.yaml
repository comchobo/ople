services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ople}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ople}
      POSTGRES_DB: ${POSTGRES_DB:-ople}
    ports:
      - "5432:5432"
    volumes:
      - ople-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ople} -d ${POSTGRES_DB:-ople}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ople}:${POSTGRES_PASSWORD:-ople}@db:5432/${POSTGRES_DB:-ople}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash:1017}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_STT_MODEL: ${CLOUDFLARE_STT_MODEL:-@cf/openai/whisper-large-v3-turbo}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
    command: sh -ec 'uv sync --frozen && uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ople-recordings:/recordings
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    init: true
    ipc: host

volumes:
  ople-db-data:
    name: ople-db-data
  ople-recordings:
