services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ople}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ople}
      POSTGRES_DB: ${POSTGRES_DB:-ople}
    ports:
      - "5432:5432"
    volumes:
      - ople-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ople} -d ${POSTGRES_DB:-ople}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ople}:${POSTGRES_PASSWORD:-ople}@db:5432/${POSTGRES_DB:-ople}
      CODYSSEY_API_BASE_URL: ${CODYSSEY_API_BASE_URL:-https://copa.codyssey.kr}
      CODYSSEY_API_KEY: ${CODYSSEY_API_KEY:-}
      INTERVIEWER_LLM_MODEL: ${INTERVIEWER_LLM_MODEL:-claude-haiku-4}
      PLANNER_LLM_MODEL: ${PLANNER_LLM_MODEL:-gpt-5.5}
      CODYSSEY_TTS_MODEL: ${CODYSSEY_TTS_MODEL:-gpt-4o-mini-tts}
      CODYSSEY_TTS_VOICE: ${CODYSSEY_TTS_VOICE:-alloy}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      WORKERS_AI_STT_MODEL: ${WORKERS_AI_STT_MODEL:-@cf/openai/whisper-large-v3-turbo}
      INTERVIEW_MAX_QUESTIONS: ${INTERVIEW_MAX_QUESTIONS:-10}
      AUDIO_STORAGE_PATH: /app/storage/audio
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./agents:/app/agents
      - ./storage/audio:/app/storage/audio
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: frontend/Dockerfile.e2e
    init: true
    ipc: host

volumes:
  ople-db-data:
    name: ople-db-data
