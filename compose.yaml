services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ople}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ople}
      POSTGRES_DB: ${POSTGRES_DB:-ople}
    ports:
      - "5432:5432"
    volumes:
      - ople-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ople} -d ${POSTGRES_DB:-ople}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ople}:${POSTGRES_PASSWORD:-ople}@db:5432/${POSTGRES_DB:-ople}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: frontend/Dockerfile.e2e
    init: true
    ipc: host

volumes:
  ople-db-data:
