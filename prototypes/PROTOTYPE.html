<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ople — 오디세이 플래너</title>
  <style>
    :root { --ink:#222; --muted:#666; --line:#d4d4d4; --paper:#fff; --soft:#f3f3f3; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; display:grid; place-items:center; background:#eaeaea; color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; word-break:keep-all; }
    ::selection { background:var(--ink); color:white; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; border:1px solid var(--line); background:white; border-radius:3px; min-height:44px; padding:9px 14px; line-height:1.4; }
    button:hover { background:var(--soft); border-color:#999; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex="0"]:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    a { color:inherit; text-underline-offset:4px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:30px; line-height:1.35; letter-spacing:-1px; font-weight:650; text-wrap:balance; }
    h2 { font-size:20px; line-height:1.45; letter-spacing:-.5px; font-weight:650; }
    h3 { font-size:16px; font-weight:650; }
    small,.small { font-size:12px; }
    .muted { color:var(--muted); }
    .primary { background:var(--ink); color:white; border-color:var(--ink); }
    .primary:hover { background:#444; color:white; }
    .wide { width:100%; }
    .text-button { border-color:transparent; background:transparent; padding:8px; text-decoration:underline; text-underline-offset:4px; }
    .icon-button { width:44px; padding:0; display:inline-grid; place-items:center; flex-shrink:0; }
    .row { display:flex; align-items:center; gap:8px; }
    .between { justify-content:space-between; }
    .stack { display:grid; gap:12px; }
    .notice { border:1px solid var(--line); background:var(--soft); padding:14px; font-size:13px; }
    .error { border:1px solid #555; padding:14px; background:#f0f0f0; }
    .space { margin-top:24px; }
    #app { width:min(100%,1194px); height:min(100dvh,834px); margin:auto; background:var(--paper); border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
    .site-header { height:70px; flex-shrink:0; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { font-weight:750; font-size:24px; letter-spacing:-1px; text-decoration:none; }
    .header-links { display:flex; gap:4px; align-items:center; font-size:13px; }
    main { flex:1; min-height:0; padding:28px; overflow:auto; scrollbar-color:#aaa var(--soft); scrollbar-width:thin; }
    .intro main { overflow:hidden; padding:0; }
    .intro-layout { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); height:100%; }
    .intro-layout > section { min-width:0; overflow:auto; padding:32px; scrollbar-color:#aaa var(--soft); scrollbar-width:thin; }
    .intro-layout > section + section { border-left:1px solid var(--line); padding:28px; }
    .intro-section + .intro-section { border-top:1px solid var(--line); margin-top:28px; padding-top:24px; }
    .intro-hero h1 { font-size:36px; margin-bottom:18px; }
    .intro-hero p { color:#555; margin-bottom:24px; max-width:65ch; }
    .intro-hero .primary { width:auto; min-width:200px; }
    .intro-section > h2 { margin-bottom:14px; }
    .intro-section > p { margin-bottom:18px; color:#555; max-width:65ch; }
    .numbered { display:grid; grid-template-columns:25px 1fr; gap:10px; padding:14px 0; }
    .numbered + .numbered { border-top:1px solid #e5e5e5; }
    .numbered .number { font-size:12px; color:var(--muted); padding-top:3px; }
    .numbered p { color:var(--muted); font-size:14px; margin-top:4px; }
    .example { border:1px solid var(--line); padding:16px; }
    .example .years { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:18px 0 12px; }
    .sample-row { font-size:12px; margin-top:9px; }
    .sample-bar { height:9px; background:#aaa; margin-top:5px; }
    .steps { margin-bottom:28px; }
    .steps ol { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0; margin:0; list-style:none; }
    .steps li { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 4px; border:1px solid var(--line); background:var(--soft); font-size:13px; white-space:nowrap; }
    .steps li[aria-current="step"] { background:var(--ink); border-color:var(--ink); color:white; font-weight:650; }
    .step-number { font-size:16px; font-weight:650; }
    .prepare main > section { max-width:640px; margin:36px auto; }
    .prepare main > section h1 { margin-bottom:18px; }
    .prepare main > section ol { padding-left:21px; margin:24px 0; }
    .prepare main > section li { padding:5px 0; }
    .prepare main > section .primary { width:auto; min-width:240px; }
    .interview-head { grid-column:1 / -1; margin-bottom:28px; }
    .progress { display:flex; gap:5px; margin-top:16px; }
    .progress span { height:3px; background:#e5e5e5; flex:1; }
    .progress span.done { background:#333; }
    .interview main { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); column-gap:32px; overflow:hidden; }
    .interview .steps { grid-column:1 / -1; }
    .question { min-width:0; overflow:auto; padding:24px 16px 24px 0; }
    .question h1 { font-size:32px; max-width:23ch; }
    .record-panel { overflow:auto; border-left:1px solid var(--line); padding:28px 0 28px 28px; text-align:center; }
    .record-state { display:flex; gap:8px; align-items:center; justify-content:center; font-size:13px; }
    .status-dot { height:7px; width:7px; border:1px solid #555; border-radius:50%; }
    .status-dot.active { background:#333; }
    .timer { font-variant-numeric:tabular-nums; font-size:44px; letter-spacing:1px; margin:24px 0; }
    .record-actions { display:flex; align-items:center; justify-content:center; gap:20px; min-height:88px; }
    .audio-button { display:inline-grid; place-items:center; width:48px; height:48px; padding:0; border-radius:50%; flex-shrink:0; }
    .audio-button svg { width:22px; height:22px; }
    .audio-button.main-control { width:72px; height:72px; }
    .audio-button.main-control svg { width:28px; height:28px; }
    .complete main > h1,.complete main > p,.complete .notice { width:min(100%,640px); margin-inline:auto; }
    .complete main > h1,.complete main > p { text-align:center; }
    .complete main > .primary { display:block; width:240px; margin-inline:auto; }
    .busy { padding-top:48px; max-width:65ch; }
    .busy h1 { font-size:26px; margin-bottom:16px; }
    .board main { display:flex; flex-direction:column; overflow:hidden; padding-bottom:0; }
    .board-heading { margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0; }
    .board-heading > div { min-width:0; }
    .board-heading > button { flex-shrink:0; }
    .board-heading h1 { font-size:26px; margin:0 0 6px; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid #333; margin-bottom:24px; flex-shrink:0; }
    .tabs button { border:0; border-radius:0; background:white; color:var(--muted); padding:13px; }
    .tabs button[aria-selected="true"] { color:#222; font-weight:650; box-shadow:inset 0 -3px #222; }
    .board-layout { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:32px; }
    .timeline-pane,.details-pane { min-width:0; min-height:0; overflow:auto; scrollbar-color:#aaa var(--soft); scrollbar-width:thin; padding:0 8px 20px; }
    .timeline-pane { margin-left:-8px; }
    .details-pane { padding-left:0; }
    .plan-heading { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
    .plan-heading h2 { flex:1; min-width:0; overflow-wrap:anywhere; padding-top:5px; }
    .plan-description { color:#555; font-size:14px; line-height:1.8; margin-bottom:20px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .plan-kind { font-size:12px; color:var(--muted); margin-bottom:5px; }
    .timeline-label { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 0 16px; }
    .timeline-label h2 { font-size:16px; letter-spacing:0; }
    .timeline-label span { font-size:12px; color:var(--muted); }
    .timeline-viewport { overflow-x:auto; overscroll-behavior-x:contain; border:1px solid #bbb; background:white; touch-action:pan-x pan-y; }
    #timeline-track { position:relative; min-width:100%; }
    .timeline-years { height:38px; display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid #ccc; font-size:11px; color:#555; }
    .timeline-years span { padding:10px 7px; border-left:1px solid #ddd; }
    .timeline-years span:first-child { border-left:0; }
    .timeline-row { height:54px; position:relative; border-bottom:1px solid #e5e5e5; background:repeating-linear-gradient(to right,transparent 0,transparent calc(20% - 1px),#eee calc(20% - 1px),#eee 20%); }
    .timeline-row:last-child { border-bottom:0; }
    .piece { position:absolute; top:5px; height:44px; background:#ececec; border:1px solid #999; border-radius:2px; min-width:0; touch-action:pan-y; user-select:none; }
    .piece-main { display:block; width:100%; height:100%; border:0; border-radius:0; background:transparent; padding:5px 27px 4px 6px; text-align:left; overflow:hidden; min-height:0; white-space:nowrap; text-overflow:ellipsis; font-size:12px; }
    .piece-main small { display:block; font-size:10px; line-height:1.1; color:#555; }
    .piece-edit { position:absolute; top:0; right:0; width:28px; height:42px; min-height:0; border:0; border-radius:0; padding:0; background:rgba(255,255,255,.5); font-size:14px; }
    .piece.selected .piece-edit { right:15px; }
    .piece.selected { border:2px solid #222; z-index:3; background:#ddd; touch-action:none; }
    .piece.selected .piece-main { cursor:grab; }
    .resize-handle { position:absolute; top:-4px; bottom:-4px; width:24px; background:#fff; border:1px solid #333; touch-action:none; z-index:4; padding:0; min-height:0; }
    .resize-handle::after { content:""; position:absolute; top:13px; bottom:13px; left:9px; width:2px; background:#777; }
    .resize-handle.start { left:-8px; }
    .resize-handle.end { right:-8px; }
    .add-piece { margin-top:14px; }
    .rating-section { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
    .rating-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .rating-value { border:1px solid var(--line); padding:8px; font-size:12px; }
    .rating-meter { height:3px; background:#eee; margin-top:7px; }
    .rating-meter span { height:100%; background:#777; display:block; }
    .save-error { margin-top:20px; padding:12px; border:1px solid var(--line); font-size:13px; }
    .save-error:empty { display:none; }
    dialog { width:560px; max-width:calc(100% - 48px); max-height:min(786px,calc(100dvh - 48px)); margin:auto; border:1px solid #999; border-radius:7px; padding:0; color:var(--ink); background:white; overscroll-behavior:contain; }
    dialog::backdrop { background:rgba(0,0,0,.3); }
    .sheet-inner { padding:24px; }
    .sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .sheet-header h2 { font-size:20px; }
    .sheet-footer { display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line); margin-top:24px; padding-top:16px; }
    .sheet-footer > .primary { margin-left:auto; }
    .sheet-copy { color:#555; margin-bottom:20px; font-size:14px; }
    label.field { display:block; font-size:13px; margin:16px 0 6px; }
    input:not([type="range"]),select,textarea { display:block; width:100%; border:1px solid #aaa; border-radius:3px; padding:11px; background:white; min-height:44px; }
    textarea { resize:vertical; }
    input,textarea { caret-color:var(--ink); }
    input:focus,select:focus,textarea:focus { outline:2px solid #555; outline-offset:1px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .rating-field { border-top:1px solid #ddd; padding-top:16px; margin-top:18px; }
    .rating-field label { font-size:14px; font-weight:600; }
    .rating-field p { font-size:12px; color:#666; margin:3px 0 8px; }
    .rating-field input { width:100%; accent-color:#333; min-height:44px; }
    .account-info { padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .account-menu { display:grid; gap:6px; }
    .account-menu button { text-align:left; }
    .site-footer { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); font-size:13px; color:var(--muted); flex-shrink:0; }
    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:calc(100% - 40px); width:max-content; background:#222; color:white; padding:10px 16px; font-size:13px; z-index:20; pointer-events:none; }
    #toast:empty { display:none; }
    svg { width:15px; height:15px; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.5; }
    @media (prefers-reduced-motion:no-preference) { dialog[open] { animation:modal-in .15s ease-out; } @keyframes modal-in { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } } }
  </style>
</head>
<body>
  <div id="app"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const STORAGE = 'ople-prototype-v0';
    const categories = { work:'일', creative:'창작', relation:'관계', rest:'휴식' };
    const ratingLabels = { resources:'자원', appeal:'호감', confidence:'자신감', coherence:'일관성' };
    const ratingHelp = { resources:'필요한 시간·비용·역량을 확보할 수 있나요?', appeal:'이 삶의 모습에 얼마나 끌리나요?', confidence:'실행할 수 있다는 자신감은 어느 정도인가요?', coherence:'내 가치와 원하는 삶에 얼마나 맞나요?' };
    const questions = [
      '지금의 일상에서 유지하고 싶은 것과 바꾸고 싶은 것은 무엇인가요?',
      '앞으로 5년 안에 해보고 싶은 일이나 살아보고 싶은 모습은 무엇인가요?',
      '계획을 세울 때 고려해야 할 시간, 비용, 관계 등의 여건이 있나요?'
    ];
    const editIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg>';
    const userIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>';
    const app = document.querySelector('#app');
    const sheet = document.querySelector('#sheet');
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORAGE) || '{}') || {}; } catch { /* Empty or unavailable storage. */ }
    let user = stored.user === true;
    let board = Array.isArray(stored.board) && stored.board.length === 3 ? stored.board : null;
    let createdAt = stored.createdAt || '';
    let view = user && board ? 'board' : 'intro';
    let activePlan = 0, questionIndex = 0, recordState = 'idle', seconds = 0;
    let selected = null, saveState = '저장됨';
    let simulatedError = false, storageFailure = false, interviewError = false, generationToken = 0;
    let returnFocus = null, toastTimer, saveTimer, questionTimer;
    const uid = () => globalThis.crypto?.randomUUID?.() || `piece-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const button = (label, action, cls = '', extra = '') => `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
    const audioIcons = {
      mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',
      pause:'<path d="M8 5v14M16 5v14"/>',
      play:'<path d="m9 5 11 7-11 7Z"/>',
      restart:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',
      submit:'<path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3"/>',
      pending:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
    };
    const audioButton = (label, action, icon, cls = '', extra = '') => button(`<svg viewBox="0 0 24 24" aria-hidden="true">${audioIcons[icon]}</svg>`, action, `audio-button ${cls}`, `aria-label="${label}" title="${label}" ${extra}`);
    const pieceData = (title, description, category, start, duration) => ({ id:uid(), title, description, category, start, duration });

    function samplePlans() {
      return [
        {
          kind:'현재 방향을 발전시키는 계획', title:'일을 이어가며 생활의 여유 만들기',
          description:'현재 일을 유지하면서 업무 경계를 정하고, 창작과 관계에 쓸 시간을 확보합니다. 작은 시도로 생활의 변화를 먼저 확인합니다.', scores:{},
          pieces:[
            pieceData('업무 경계 정하기','평일에는 정해진 시간에 일을 마칩니다. 3개월 동안 야근 빈도를 기록하고 지속 가능한 방식을 정합니다.','work',0,12),
            pieceData('전문 역량 넓히기','현재 업무와 연결된 교육과 프로젝트를 한 가지씩 진행합니다.','work',12,30),
            pieceData('주말 제작 모임','주말 하루를 사용해 소품을 만듭니다. 월 예산 30만 원 안에서 6개월간 시도하고 계속할지 판단합니다.','creative',0,18),
            pieceData('작은 마켓 참여','만든 물건을 판매해보고 제작 시간과 수입을 기록합니다.','creative',24,24),
            pieceData('정기적인 만남','한 달에 두 번 가까운 사람들과 시간을 잡습니다.','relation',0,60),
            pieceData('한 달 지역 살기','휴가와 원격 근무 가능 여부를 확인한 뒤 다른 지역에서 생활해봅니다.','rest',36,12)
          ]
        },
        {
          kind:'다른 방향을 탐색하는 계획', title:'작은 제작 활동을 새로운 일로 시험하기',
          description:'고정 수입을 유지한 채 제작·판매를 시험합니다. 수요와 생활비를 확인한 뒤 일하는 방식을 바꿀지 결정합니다.', scores:{},
          pieces:[
            pieceData('전환 자금 마련','매달 일정 금액을 모아 생활비 6개월분을 확보합니다.','work',0,24),
            pieceData('소량 제작·판매','주말 하루와 월 30만 원을 사용해 3개월씩 제품과 판매 경로를 시험합니다.','creative',0,18),
            pieceData('반복 구매 검증','매출뿐 아니라 재구매와 실제 작업 시간을 확인해 지속 가능성을 판단합니다.','creative',18,18),
            pieceData('근무 방식 조정','생활비를 감당할 수 있을 때만 근무 시간을 줄이거나 새로운 일로 옮깁니다.','work',36,24),
            pieceData('동료 네트워크','비슷한 일을 하는 사람들과 정기적으로 작업과 운영 경험을 나눕니다.','relation',6,48),
            pieceData('작업 없는 주말','매달 한 주말은 제작과 판매를 쉬며 생활 리듬을 점검합니다.','rest',0,60)
          ]
        },
        {
          kind:'원하는 삶에서 출발하는 계획', title:'지역을 옮겨도 이어지는 일상 만들기',
          description:'장소에 얽매이지 않고 일하고 만드는 생활을 탐색합니다. 짧은 체류부터 시작해 수입과 관계를 유지할 수 있는지 확인합니다.', scores:{},
          pieces:[
            pieceData('원격 업무 시험','현재 일에서 원격으로 가능한 업무를 정리하고 짧은 기간부터 협의합니다.','work',0,18),

        case 'begin': startInterview(); break;
        case 'record': recordState = 'recording'; render('pause'); break;
        case 'pause': recordState = 'paused'; render('record'); break;
        case 'rerecord': openSheet('다시 녹음할까요?', `<p class="sheet-copy">이 질문의 기존 녹음을 지우고 다시 시작합니다.</p><div class="sheet-footer">${button('취소','close-sheet')}${button('다시 시작','confirm-rerecord','primary')}</div>`); break;
        case 'confirm-rerecord': closeSheet(); seconds = 0; recordState = 'idle'; interviewError = false; render('record'); break;
        case 'submit-answer': case 'retry-answer': submitAnswer(); break;
        case 'exit-interview': openSheet('인터뷰를 나갈까요?', `<p class="sheet-copy">진행 중인 인터뷰는 저장되지 않습니다.${board ? ' 기존 계획은 유지됩니다.' : ''}</p><div class="sheet-footer">${button('계속하기','close-sheet')}${button('나가기','confirm-exit','primary')}</div>`); break;
        case 'confirm-exit': closeSheet(); navigate(board ? 'board' : 'prepare'); break;
        case 'generate': case 'retry-generation': generate(); break;
        case 'edit-plan': planSheet(); break;
        case 'edit-piece': if (!suppressClick) pieceSheet(id); break;
        case 'add-piece': pieceSheet(); break;
        case 'duplicate-piece': { const source = board[activePlan].pieces.find(item => item.id === id); board[activePlan].pieces.push({ ...source, id:uid(), title:source.title + ' (복사)' }); closeSheet(); persist(); render(); toast('조각을 복제했습니다.'); break; }
        case 'delete-piece': openSheet('조각을 삭제할까요?', `<p class="sheet-copy">이 조각을 현재 계획에서 삭제합니다.</p><div class="sheet-footer">${button('취소','close-sheet')}${button('조각 삭제','confirm-delete','primary',`data-id="${esc(id)}"`)}</div>`); break;
        case 'confirm-delete': board[activePlan].pieces = board[activePlan].pieces.filter(item => item.id !== id); selected = null; closeSheet(); persist(); render(); break;
        case 'ratings': ratingsSheet(); break;
        case 'reset-ratings': board[activePlan].scores = {}; closeSheet(); persist(); render(); break;
        case 'retry-save': storageFailure = false; persist(); break;
      }
    });
    function confirmNewPlan() {
      if (!board) { closeSheet(); navigate('prepare'); return; }
      openSheet('새 계획을 만들까요?', `<p class="sheet-copy">새 인터뷰로 계획을 만듭니다. 새 결과가 생성되면 현재 세 계획을 대체합니다. 생성 전까지는 기존 계획이 유지됩니다.</p><div class="sheet-footer">${button('취소','close-sheet')}${button('새 인터뷰 시작','confirm-new','primary')}</div>`);
    }
    document.addEventListener('submit', event => {
      const form = event.target;
      if (!['piece-form','plan-form','ratings-form'].includes(form.id)) return;
      event.preventDefault(); const data = new FormData(form);
      if (form.id === 'piece-form') {
        const start = Number(data.get('start')); const title = String(data.get('title')).trim(); if (!title) return;
        const piece = { id:form.dataset.id || uid(), title, description:String(data.get('description')).trim(), category:data.get('category'), start, duration:Math.max(1,Math.min(60 - start,Number(data.get('duration')))) };
        const index = board[activePlan].pieces.findIndex(item => item.id === piece.id);
        if (index === -1) board[activePlan].pieces.push(piece); else board[activePlan].pieces[index] = piece;
      } else if (form.id === 'plan-form') {
        const title = String(data.get('title')).trim(); if (!title) return;
        board[activePlan].title = title; board[activePlan].description = String(data.get('description')).trim();
      } else {
        form.querySelectorAll('input[type="range"]').forEach(input => { board[activePlan].scores[input.name] = Number(input.value); });
      }
      selected = null; closeSheet(); persist(); render();
    });
    document.addEventListener('input', event => {
      if (event.target.matches('#ratings-form input')) { document.querySelector(`#output-${event.target.name}`).textContent = `${event.target.value} / 10`; }
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'piece-start') { const duration = document.querySelector('#piece-duration'); duration.max = 60 - Number(event.target.value); duration.value = Math.min(Number(duration.value),Number(duration.max)); }
    });
    document.addEventListener('keydown', event => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
        event.preventDefault(); activePlan = event.key === 'Home' ? 0 : event.key === 'End' ? 2 : (activePlan + (event.key === 'ArrowLeft' ? 2 : 1)) % 3;
        selected = null; render(); document.querySelector(`#tab-${activePlan}`).focus();
      }
      if (event.key === 'Escape' && selected && !sheet.open) { selected = null; render(); }
    });

    // Pointer handling keeps scrolling available until a deliberate long press selects a piece.
    let suppressClick = false, longPressTimer, drag = null;
    function clearSelection() {
      selected = null;
      document.querySelector('.piece.selected')?.classList.remove('selected');
      document.querySelectorAll('.resize-handle').forEach(handle => handle.remove());
    }
    document.addEventListener('pointerdown', event => {
      if (view !== 'board' || sheet.open || event.button > 0) return;
      const element = event.target.closest('.piece');
      if (!element) { if (selected) clearSelection(); return; }
      if (event.target.closest('.piece-edit')) return;
      const id = element.dataset.id;
      const startX = event.clientX, startY = event.clientY;
      const beginDrag = () => {
        const piece = board[activePlan].pieces.find(item => item.id === id);
        const handle = event.target.closest('.resize-handle');
        const viewport = document.querySelector('#timeline-viewport');
        const scrollLeft = viewport.scrollLeft;
        const pane = document.querySelector('.timeline-pane');
        const scrollTop = pane.scrollTop;
        if (selected !== id) { selected = id; render(); document.querySelector('#timeline-viewport').scrollLeft = scrollLeft; document.querySelector('.timeline-pane').scrollTop = scrollTop; }
        drag = { id, startX, startY, start:piece.start, duration:piece.duration, mode:handle?.classList.contains('start') ? 'start' : handle ? 'end' : 'move', width:document.querySelector('#timeline-track').getBoundingClientRect().width, changed:false };
        suppressClick = true;
      };
      if (selected === id) { event.preventDefault(); beginDrag(); }
      else longPressTimer = setTimeout(beginDrag,450);
      const cancelIfScrolling = (move) => { if (Math.abs(move.clientX - startX) > 8 || Math.abs(move.clientY - startY) > 8) clearTimeout(longPressTimer); };
      document.addEventListener('pointermove',cancelIfScrolling);
      const cleanup = () => { document.removeEventListener('pointermove',cancelIfScrolling); document.removeEventListener('pointerup',cleanup); document.removeEventListener('pointercancel',cleanup); };
      document.addEventListener('pointerup',cleanup); document.addEventListener('pointercancel',cleanup);
    });
    document.addEventListener('pointermove', event => {
      if (!drag) return; event.preventDefault();
      const piece = board[activePlan].pieces.find(item => item.id === drag.id);
      const delta = Math.round((event.clientX - drag.startX) / drag.width * 60);
      if (drag.mode === 'move') piece.start = Math.max(0,Math.min(60 - drag.duration,drag.start + delta));
      if (drag.mode === 'start') { const end = drag.start + drag.duration; piece.start = Math.max(0,Math.min(end - 1,drag.start + delta)); piece.duration = end - piece.start; }
      if (drag.mode === 'end') piece.duration = Math.max(1,Math.min(60 - drag.start,drag.duration + delta));
      drag.changed = piece.start !== drag.start || piece.duration !== drag.duration;
      const element = document.querySelector(`.piece[data-id="${drag.id}"]`); if (element) { element.style.left = `${piece.start / 60 * 100}%`; element.style.width = `${piece.duration / 60 * 100}%`; }
    }, { passive:false });
    function endDrag() { clearTimeout(longPressTimer); if (drag?.changed) persist(); drag = null; setTimeout(() => { suppressClick = false; },100); }
    document.addEventListener('pointerup',endDrag); document.addEventListener('pointercancel',endDrag);
    window.addEventListener('blur',endDrag);
    window.addEventListener('pagehide', () => { try { writeStorage(); } catch { /* Save state remains visible on next edit. */ } });
    render();
  </script>
</body>
</html>
