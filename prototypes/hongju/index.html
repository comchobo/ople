<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ople — 오디세이 플래너</title>
  <style>
    :root { --ink:#222; --muted:#666; --line:#d4d4d4; --paper:#fff; --soft:#f3f3f3; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eaeaea; color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; word-break:keep-all; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; border:1px solid var(--line); background:white; border-radius:3px; min-height:44px; padding:9px 14px; line-height:1.4; }
    button:hover { background:var(--soft); border-color:#999; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,a:focus-visible,summary:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    a { color:inherit; text-underline-offset:4px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:30px; line-height:1.35; letter-spacing:-1px; font-weight:650; }
    h2 { font-size:20px; line-height:1.45; letter-spacing:-.5px; font-weight:650; }
    h3 { font-size:16px; font-weight:650; }
    small,.small { font-size:12px; }
    .muted { color:var(--muted); }
    .eyebrow { display:block; font-size:12px; color:var(--muted); margin-bottom:10px; }
    .primary { background:var(--ink); color:white; border-color:var(--ink); }
    .primary:hover { background:#444; color:white; }
    .wide { width:100%; }
    .text-button { border-color:transparent; background:transparent; padding:8px; text-decoration:underline; text-underline-offset:4px; }
    .icon-button { width:44px; padding:0; display:inline-grid; place-items:center; flex-shrink:0; }
    .row { display:flex; align-items:center; gap:8px; }
    .between { justify-content:space-between; }
    .stack { display:grid; gap:12px; }
    .rule { border-top:1px solid var(--line); }
    .notice { border:1px solid var(--line); background:var(--soft); padding:14px; font-size:13px; }
    .error { border:1px solid #555; padding:14px; background:#f0f0f0; }
    .space { margin-top:24px; }
    #app { width:100%; min-height:100dvh; margin:auto; background:var(--paper); }
    .site-header { height:70px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { font-weight:750; font-size:24px; letter-spacing:-1px; text-decoration:none; }
    .header-links { display:flex; gap:4px; align-items:center; font-size:13px; }
    main { max-width:720px; margin:auto; padding:40px 32px; }
    .intro main { padding-top:0; padding-bottom:16px; }
    .intro-section { padding:32px 0; }
    .intro-section:last-child { padding-bottom:0; }
    .intro-section + .intro-section { border-top:1px solid var(--line); }
    .intro-hero { padding-top:36px; }
    .intro-hero h1 { margin-bottom:16px; }
    .intro-hero p { color:#555; margin-bottom:24px; }
    .intro-section > h2 { margin-bottom:14px; }
    .intro-section > p { margin-bottom:18px; color:#555; }
    .numbered { display:grid; grid-template-columns:25px 1fr; gap:10px; padding:16px 0; }
    .numbered + .numbered { border-top:1px solid #e5e5e5; }
    .numbered .number { font-size:12px; color:var(--muted); padding-top:3px; }
    .numbered p { color:var(--muted); font-size:14px; margin-top:4px; }
    .example { border:1px solid var(--line); padding:16px; }
    .example .years { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:18px 0 12px; }
    .sample-row { font-size:12px; margin-top:9px; }
    .sample-bar { height:9px; background:#aaa; margin-top:5px; }
    .steps { margin-bottom:28px; }
    .steps ol { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0; margin:0; list-style:none; }
    .steps li { display:flex; align-items:center; justify-content:center; gap:6px; padding:12px 4px; border:1px solid var(--line); background:var(--soft); font-size:12px; white-space:nowrap; }
    .steps li[aria-current="step"] { background:var(--ink); border-color:var(--ink); color:white; font-weight:650; }
    .step-number { font-size:16px; font-weight:650; }
    .prepare h1 { margin-bottom:14px; }
    .prepare ol { padding-left:21px; margin:24px 0; }
    .prepare li { padding:2px 0; }
    .interview-head { margin-bottom:30px; }
    .progress { display:flex; gap:5px; margin-top:16px; }
    .progress span { height:3px; background:#e5e5e5; flex:1; }
    .progress span.done { background:#333; }
    .question { margin:0; }
    .question h1 { font-size:25px; }
    .record-panel { margin-top:28px; border-top:1px solid var(--line); padding-top:22px; }
    .record-state { display:flex; gap:8px; align-items:center; font-size:13px; }
    .status-dot { height:7px; width:7px; border:1px solid #555; border-radius:50%; }
    .status-dot.active { background:#333; }
    .timer { font-variant-numeric:tabular-nums; font-size:38px; letter-spacing:1px; margin:15px 0; }
    .record-actions { display:flex; align-items:center; justify-content:center; gap:20px; min-height:88px; }
    .audio-button { display:inline-grid; place-items:center; width:48px; height:48px; padding:0; border-radius:50%; flex-shrink:0; }
    .audio-button svg { width:22px; height:22px; }
    .audio-button.main-control { width:72px; height:72px; }
    .audio-button.main-control svg { width:28px; height:28px; }
    .busy { padding-top:48px; min-height:300px; }
    .busy h1 { font-size:26px; margin-bottom:16px; }
    .busy ol { padding-left:22px; margin:26px 0; color:var(--muted); }
    .busy li { margin:10px 0; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid #333; margin-bottom:24px; }
    .tabs button { border:0; border-radius:0; background:white; color:var(--muted); padding:13px 3px; }
    .tabs button[aria-selected="true"] { color:#222; font-weight:650; box-shadow:inset 0 -3px #222; }
    .plan-heading { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
    .plan-heading h2 { flex:1; min-width:0; overflow-wrap:anywhere; padding-top:5px; }
    .plan-description { color:#555; font-size:14px; margin-bottom:20px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .rating-section { margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
    .rating-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .rating-value { border:1px solid var(--line); padding:10px; font-size:12px; }
    .rating-meter { height:3px; background:#eee; margin-top:7px; }
    .rating-meter span { height:100%; background:#777; display:block; }
    .save-error { margin-top:20px; padding:12px; border:1px solid var(--line); font-size:13px; }
    .save-error:empty { display:none; }
    dialog { width:min(500px,100%); max-width:100%; max-height:90dvh; margin:auto auto 0; border:1px solid #999; border-bottom:0; border-radius:7px 7px 0 0; padding:0; color:var(--ink); background:white; overscroll-behavior:contain; }
    dialog::backdrop { background:rgba(0,0,0,.3); }
    .sheet-inner { padding:10px 20px max(24px,env(safe-area-inset-bottom)); }
    .sheet-grip { height:3px; width:32px; background:#ccc; margin:0 auto 12px; }
    .sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .sheet-header h2 { font-size:20px; }
    .sheet-footer { display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line); margin-top:24px; padding-top:16px; }
    .sheet-footer > .primary { margin-left:auto; }
    .sheet-copy { color:#555; margin-bottom:20px; font-size:14px; }
    label.field { display:block; font-size:13px; margin:16px 0 6px; }
    input:not([type="range"]),select,textarea { display:block; width:100%; border:1px solid #aaa; border-radius:3px; padding:11px; background:white; min-height:44px; }
    textarea { resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:2px solid #555; outline-offset:1px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .rating-field { border-top:1px solid #ddd; padding-top:16px; margin-top:18px; }
    .rating-field label { font-size:14px; font-weight:600; }
    .rating-field p { font-size:12px; color:#666; margin:3px 0 8px; }
    .rating-field input { width:100%; accent-color:#333; }
    .account-info { padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .account-menu { display:grid; gap:6px; }
    .account-menu button { text-align:left; }
    .site-footer { display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); max-width:calc(100% - 40px); width:max-content; background:#222; color:white; padding:10px 16px; font-size:13px; z-index:20; pointer-events:none; }
    #toast:empty { display:none; }
    svg { width:15px; height:15px; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.5; }
    @media (max-width:380px) { main { padding-inline:16px; } .site-header { padding-inline:16px; } h1 { font-size:28px; } }
    @media (prefers-reduced-motion:no-preference) { dialog[open] { animation:sheet-in .15s ease-out; } @keyframes sheet-in { from { transform:translateY(16px); opacity:0; } to { transform:translateY(0); opacity:1; } } }
    ::selection { background:#dedede; color:#111; }
    input,textarea { caret-color:var(--ink); }
    :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    .library main { max-width:1120px; }
    .library-heading { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:40px; }
    .library-heading p { margin-top:8px; }
    .planner-list { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
    .planner-item { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:24px 0; border-bottom:1px solid var(--line); }
    .planner-item > div:first-child { min-width:0; }
    .planner-item h2 { overflow-wrap:anywhere; }
    .planner-item .planner-open { border:0; background:none; padding:0; text-align:left; font-size:20px; font-weight:650; }
    .planner-actions { display:flex; gap:8px; flex-shrink:0; }
    .empty-library { padding:64px 0; border-block:1px solid var(--line); }
    .empty-library p { margin:12px 0 24px; color:var(--muted); }
    .editor { height:100dvh; min-height:540px; display:flex; flex-direction:column; }
    .editor .site-header { height:60px; flex-shrink:0; padding-inline:24px; }
    .editor main { max-width:none; width:100%; padding:0; flex:1; min-height:0; display:flex; flex-direction:column; }
    .editor-heading { padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); }
    .editor-heading h1 { font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .editor-title { min-width:0; display:flex; align-items:center; gap:12px; }
    .editor-heading > .row { flex-shrink:0; }
    .editor-title > div { min-width:0; }
    .editor-heading .small { font-size:11px; }
    .editor-body { display:flex; flex:1; min-height:0; }
    .plan-sidebar { width:260px; flex-shrink:0; padding:20px; overflow:auto; border-right:1px solid var(--line); }
    .plan-sidebar .tabs { margin-bottom:24px; }
    .plan-sidebar .plan-heading { margin-bottom:12px; }
    .plan-sidebar .plan-description { margin-bottom:24px; }
    .plan-sidebar .rating-grid { gap:8px; }
    .plan-sidebar .rating-section { margin-top:24px; }
    @media (min-width:701px) { .plan-details[hidden] { display:block; } .editor-heading [data-action="toggle-details"] { display:none; } }
    .workspace { flex:1; min-width:0; display:flex; flex-direction:column; }
    .canvas-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); background:white; }
    .tool-group { display:flex; align-items:center; gap:4px; }
    .tool-group + .tool-group { border-left:1px solid var(--line); padding-left:8px; }
    .canvas-toolbar button { padding:8px 10px; font-size:12px; }
    .canvas-toolbar button[aria-pressed="true"] { background:var(--ink); color:white; border-color:var(--ink); }
    .canvas-toolbar input[type="color"] { width:44px; padding:5px; }
    .canvas-toolbar select { width:auto; padding:6px; font-size:12px; }
    .canvas-viewport { flex:1; min-height:240px; position:relative; overflow:hidden; background-color:#f0f0f0; background-image:radial-gradient(#ccc .8px,transparent .8px); background-size:20px 20px; touch-action:none; user-select:none; cursor:default; }
    .canvas-viewport[data-tool="hand"] { cursor:grab; }
    .canvas-viewport[data-tool="pen"],.canvas-viewport[data-tool="eraser"] { cursor:crosshair; }
    .canvas-world { position:absolute; left:0; top:0; transform-origin:0 0; }
    #plan-canvas { display:block; width:1200px; height:auto; background:white; border:1px solid #bbb; }
    .canvas-footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
    .canvas-footer .row { gap:4px; }
    .canvas-footer button { min-height:36px; padding:4px 10px; font-size:12px; }
    #zoom-value { min-width:48px; text-align:center; font-variant-numeric:tabular-nums; color:var(--ink); }
    .editor #save-status { margin:0; }
    dialog { margin:auto; border-bottom:1px solid #999; border-radius:6px; }
    @media (max-width:900px) {
      .plan-sidebar { width:220px; padding:16px; }
      .canvas-toolbar { gap:6px; padding:8px; }
      .editor-heading { padding-inline:16px; }
    }
    @media (max-width:700px) {
      main { padding:28px 20px; }
      .library-heading { align-items:flex-start; gap:12px; margin-bottom:24px; }
      .library-heading h1 { font-size:26px; }
      .library-heading > button { flex-shrink:0; }
      .planner-item { align-items:flex-start; flex-direction:column; gap:12px; }
      .planner-actions { flex-wrap:wrap; }
      .editor { min-height:620px; }
      .editor .site-header { height:52px; padding-inline:16px; }
      .editor-heading { gap:8px; padding:8px 12px; }
      .editor-heading h1 { font-size:16px; }
      .editor-heading button { font-size:12px; padding:8px; }
      .editor-title > [data-action="library"] { display:none; }
      .editor-body { flex-direction:column; }
      .plan-sidebar { width:100%; padding:0 12px; border-right:0; border-bottom:1px solid var(--line); overflow:visible; }
      .plan-sidebar .tabs { margin:0; border:0; }
      .plan-details { max-height:36dvh; overflow:auto; padding-bottom:16px; }
      .plan-details[hidden] { display:none; }
      .workspace { min-height:0; }
      .canvas-toolbar { gap:4px; }
      .canvas-toolbar .tool-group + .tool-group { padding-left:4px; }
      .canvas-footer { padding:6px 8px; }
      .gesture-help { display:none; }
      dialog { margin:auto auto 0; border-radius:7px 7px 0 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const STORAGE = 'ople-hongju-planners-v1';
    const categories = { work:'일', creative:'창작', relation:'관계', rest:'휴식' };
    const ratingLabels = { resources:'자원', appeal:'호감', confidence:'자신감', coherence:'일관성' };
    const ratingHelp = { resources:'필요한 시간·비용·역량을 확보할 수 있나요?', appeal:'이 삶의 모습에 얼마나 끌리나요?', confidence:'실행할 수 있다는 자신감은 어느 정도인가요?', coherence:'내 가치와 원하는 삶에 얼마나 맞나요?' };
    const questions = [
      '지금의 일상에서 유지하고 싶은 것과 바꾸고 싶은 것은 무엇인가요?',
      '앞으로 5년 안에 해보고 싶은 일이나 살아보고 싶은 모습은 무엇인가요?',
      '계획을 세울 때 고려해야 할 시간, 비용, 관계 등의 여건이 있나요?'
    ];
    const editIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg>';
    const userIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>';
    const app = document.querySelector('#app');
    const sheet = document.querySelector('#sheet');
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORAGE) || '{}') || {}; } catch { /* Empty or unavailable storage. */ }
    let user = stored.user === true;
    let planners = Array.isArray(stored.planners) ? stored.planners : [];
    let currentPlanner = null, board = null, createdAt = '';
    let view = user ? 'library' : 'intro';
    let activePlan = 0, questionIndex = 0, recordState = 'idle', seconds = 0;
    let selected = null, saveState = '저장됨';
    let simulatedError = false, storageFailure = false, interviewError = false, generationToken = 0;
    let returnFocus = null, toastTimer, saveTimer, questionTimer;
    const MAX_PIECES = 20, CANVAS_WIDTH = 1200, TRACK_X = 64, TRACK_WIDTH = 1072;
    let tool = 'select', penColor = '#222222', penWidth = 3, detailsOpen = false;
    const cameras = new Map(), drawingHistory = new Map();
    const uid = () => globalThis.crypto?.randomUUID?.() || `piece-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const button = (label, action, cls = '', extra = '') => `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
    const audioIcons = {
      mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',
      pause:'<path d="M8 5v14M16 5v14"/>',
      play:'<path d="m9 5 11 7-11 7Z"/>',
      restart:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',
      submit:'<path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3"/>',
      pending:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
    };
    const audioButton = (label, action, icon, cls = '', extra = '') => button(`<svg viewBox="0 0 24 24" aria-hidden="true">${audioIcons[icon]}</svg>`, action, `audio-button ${cls}`, `aria-label="${label}" title="${label}" ${extra}`);
    const pieceData = (title, description, category, start, duration) => ({ id:uid(), title, description, category, start, duration });

    function samplePlans() {
      return [
        {
          kind:'현재 방향을 발전시키는 계획', title:'일을 이어가며 생활의 여유 만들기',
          description:'현재 일을 유지하면서 업무 경계를 정하고, 창작과 관계에 쓸 시간을 확보합니다. 작은 시도로 생활의 변화를 먼저 확인합니다.', scores:{},
          pieces:[
            pieceData('업무 경계 정하기','평일에는 정해진 시간에 일을 마칩니다. 3개월 동안 야근 빈도를 기록하고 지속 가능한 방식을 정합니다.','work',0,12),
            pieceData('전문 역량 넓히기','현재 업무와 연결된 교육과 프로젝트를 한 가지씩 진행합니다.','work',12,30),
            pieceData('주말 제작 모임','주말 하루를 사용해 소품을 만듭니다. 월 예산 30만 원 안에서 6개월간 시도하고 계속할지 판단합니다.','creative',0,18),
            pieceData('작은 마켓 참여','만든 물건을 판매해보고 제작 시간과 수입을 기록합니다.','creative',24,24),
            pieceData('정기적인 만남','한 달에 두 번 가까운 사람들과 시간을 잡습니다.','relation',0,60),
            pieceData('한 달 지역 살기','휴가와 원격 근무 가능 여부를 확인한 뒤 다른 지역에서 생활해봅니다.','rest',36,12)
          ]
        },
        {
          kind:'다른 방향을 탐색하는 계획', title:'작은 제작 활동을 새로운 일로 시험하기',
          description:'고정 수입을 유지한 채 제작·판매를 시험합니다. 수요와 생활비를 확인한 뒤 일하는 방식을 바꿀지 결정합니다.', scores:{},
          pieces:[
            pieceData('전환 자금 마련','매달 일정 금액을 모아 생활비 6개월분을 확보합니다.','work',0,24),
            pieceData('소량 제작·판매','주말 하루와 월 30만 원을 사용해 3개월씩 제품과 판매 경로를 시험합니다.','creative',0,18),

      if (form.id === 'piece-form') {
        const start = Number(data.get('start')); const title = String(data.get('title')).trim(); if (!title) return;
        const piece = { id:form.dataset.id || uid(), title, description:String(data.get('description')).trim(), category:data.get('category'), start, duration:Math.max(1,Math.min(60 - start,Number(data.get('duration')))) };
        const index = board[activePlan].pieces.findIndex(item => item.id === piece.id);
        if (index === -1) { if (!canAddPiece()) return; board[activePlan].pieces.push(piece); } else board[activePlan].pieces[index] = piece;
      } else if (form.id === 'plan-form') {
        const title = String(data.get('title')).trim(); if (!title) return;
        board[activePlan].title = title; board[activePlan].description = String(data.get('description')).trim();
      } else {
        form.querySelectorAll('input[type="range"]').forEach(input => { board[activePlan].scores[input.name] = Number(input.value); });
      }
      selected = null; closeSheet(); persist(); render();
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'pen-color') penColor = event.target.value;
      if (event.target.matches('#ratings-form input')) { document.querySelector(`#output-${event.target.name}`).textContent = `${event.target.value} / 10`; }
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'pen-width') penWidth = Number(event.target.value);
      if (event.target.id === 'piece-picker' && event.target.value) { const id = event.target.value; event.target.value = ''; pieceSheet(id); }
      if (event.target.id === 'piece-start') { const duration = document.querySelector('#piece-duration'); duration.max = 60 - Number(event.target.value); duration.value = Math.min(Number(duration.value),Number(duration.max)); }
    });
    document.addEventListener('keydown', event => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
        event.preventDefault(); activePlan = event.key === 'Home' ? 0 : event.key === 'End' ? 2 : (activePlan + (event.key === 'ArrowLeft' ? 2 : 1)) % 3;
        selected = null; render(); document.querySelector(`#tab-${activePlan}`).focus();
      }
      if (event.key === 'Escape' && selected && !sheet.open) { selected = null; render(); }
    });

    let currentStroke = null, gesture = null, spaceDown = false;
    const pointers = new Map();
    function viewportPoint(event) {
      const rect = document.querySelector('#canvas-viewport').getBoundingClientRect();
      return { x:event.clientX - rect.left, y:event.clientY - rect.top };
    }
    function worldPoint(point) {
      const state = camera(); return { x:(point.x - state.x) / state.zoom, y:(point.y - state.y) / state.zoom };
    }
    function boundedPoint(point) {
      return { x:Math.max(0,Math.min(CANVAS_WIDTH,point.x)), y:Math.max(0,Math.min(document.querySelector('#plan-canvas').height / 2,point.y)) };
    }
    function pieceAt(point) {
      const plan = board[activePlan], layout = canvasLayout(document.querySelector('#plan-canvas').getContext('2d'),plan);
      for (let index = 0; index < plan.pieces.length; index++) {
        const piece = plan.pieces[index], rect = pieceRect(piece,index,layout);
        const tolerance = selected === piece.id ? 10 / camera().zoom : 0;
        if (point.y < rect.y || point.y > rect.y + rect.height || point.x < rect.x - tolerance || point.x > rect.x + rect.width + tolerance) continue;
        const edge = Math.min(rect.width / 3,12 / camera().zoom);
        const mode = selected === piece.id && Math.abs(point.x - rect.x) < edge ? 'start' : selected === piece.id && Math.abs(point.x - rect.x - rect.width) < edge ? 'end' : 'move';
        return { piece, mode };
      }
      return null;
    }
    function pointSegmentDistance(point, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = dx || dy ? Math.max(0,Math.min(1,((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy))) : 0;
      return Math.hypot(point.x - a.x - t * dx,point.y - a.y - t * dy);
    }
    function segmentsTouch(a, b, c, d, radius) {
      const cross = (p,q,r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
      if (cross(a,b,c) * cross(a,b,d) < 0 && cross(c,d,a) * cross(c,d,b) < 0) return true;
      return Math.min(pointSegmentDistance(a,c,d),pointSegmentDistance(b,c,d),pointSegmentDistance(c,a,b),pointSegmentDistance(d,a,b)) <= radius;
    }
    function eraseBetween(a, b) {
      const plan = board[activePlan], strokes = plan.strokes || [];
      const remaining = strokes.filter(stroke => !stroke.points.some((point,index) => segmentsTouch(a,b,index ? stroke.points[index - 1] : point,point,stroke.width / 2 + 8 / camera().zoom)));
      if (remaining.length !== strokes.length) {
        if (!gesture.changed) rememberDrawing();
        gesture.changed = true; plan.strokes = remaining; paintPlanCanvas();
      }
    }
    document.addEventListener('pointerdown', event => {
      const viewport = event.target.closest('#canvas-viewport');
      if (!viewport || sheet.open || event.button > 1) return;
      event.preventDefault(); viewport.focus({ preventScroll:true }); viewport.setPointerCapture(event.pointerId);
      const point = viewportPoint(event), world = worldPoint(point);
      pointers.set(event.pointerId,point);
      if (pointers.size > 1) {
        currentStroke = null;
        if (gesture?.changed) persist();
        gesture = { type:'pinch' }; paintPlanCanvas(); return;
      }
      const canvasHeight = document.querySelector('#plan-canvas').height / 2;
      const inside = world.x >= 0 && world.x <= CANVAS_WIDTH && world.y >= 0 && world.y <= canvasHeight;
      if (tool === 'hand' || spaceDown || event.button === 1 || !inside) { gesture = { type:'pan' }; return; }
      if (tool === 'pen') {
        currentStroke = { color:penColor, width:penWidth, points:[boundedPoint(world)] };
        gesture = { type:'draw' }; paintPlanCanvas(); return;
      }
      if (tool === 'eraser') { gesture = { type:'erase', previous:world, changed:false }; eraseBetween(world,world); return; }
      const hit = pieceAt(world), wasSelected = hit && selected === hit.piece.id;
      selected = hit?.piece.id || null; paintPlanCanvas();
      gesture = hit ? { type:'piece', id:hit.piece.id, mode:hit.mode, origin:world, start:hit.piece.start, duration:hit.piece.duration, wasSelected, moved:false, changed:false } : { type:'pan' };
    });
    document.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId) || !gesture) return;
      event.preventDefault();
      const previous = pointers.get(event.pointerId), point = viewportPoint(event);
      const oldPoints = [...pointers.values()]; pointers.set(event.pointerId,point);
      if (gesture.type === 'pinch' && pointers.size >= 2) {
        const newPoints = [...pointers.values()], center = points => ({ x:(points[0].x + points[1].x) / 2, y:(points[0].y + points[1].y) / 2 });
        const before = center(oldPoints), after = center(newPoints);
        const distance = points => Math.hypot(points[0].x - points[1].x,points[0].y - points[1].y);
        zoomAt(distance(newPoints) / Math.max(1,distance(oldPoints)),before.x,before.y);
        camera().x += after.x - before.x; camera().y += after.y - before.y; applyCamera(); return;
      }
      if (gesture.type === 'pan') { camera().x += point.x - previous.x; camera().y += point.y - previous.y; applyCamera(); return; }
      const world = worldPoint(point);
      if (gesture.type === 'draw') {
        const bounded = boundedPoint(world), last = currentStroke.points.at(-1);
        if (Math.hypot(bounded.x - last.x,bounded.y - last.y) >= .7) { currentStroke.points.push(bounded); paintPlanCanvas(); }
      } else if (gesture.type === 'erase') { eraseBetween(gesture.previous,world); gesture.previous = world; }
      else if (gesture.type === 'piece') {
        if (Math.hypot(world.x - gesture.origin.x,world.y - gesture.origin.y) * camera().zoom > 4) gesture.moved = true;
        if (!gesture.moved) return;
        const piece = board[activePlan].pieces.find(item => item.id === gesture.id), delta = Math.round((world.x - gesture.origin.x) / TRACK_WIDTH * 60);
        if (gesture.mode === 'move') piece.start = Math.max(0,Math.min(60 - gesture.duration,gesture.start + delta));
        if (gesture.mode === 'start') { const end = gesture.start + gesture.duration; piece.start = Math.max(0,Math.min(end - 1,gesture.start + delta)); piece.duration = end - piece.start; }
        if (gesture.mode === 'end') piece.duration = Math.max(1,Math.min(60 - gesture.start,gesture.duration + delta));
        gesture.changed = piece.start !== gesture.start || piece.duration !== gesture.duration; paintPlanCanvas();
      }
    }, { passive:false });
    function finishGesture(event) {
      if (!pointers.has(event.pointerId)) return;
      pointers.delete(event.pointerId);
      if (gesture?.type === 'pinch' && pointers.size) return;
      const finished = gesture; gesture = null;
      if (!finished) return;
      if (finished.type === 'draw' && currentStroke && event.type !== 'pointercancel') {
        rememberDrawing(); (board[activePlan].strokes ||= []).push(currentStroke); persist();
      }
      currentStroke = null;
      if (finished.changed) persist();
      if (finished.type === 'piece' && !finished.moved && finished.wasSelected && finished.mode === 'move' && event.type !== 'pointercancel') pieceSheet(finished.id);
      if (view === 'board') render();
    }
    document.addEventListener('pointerup',finishGesture); document.addEventListener('pointercancel',finishGesture);
    document.addEventListener('wheel', event => {
      if (!event.target.closest('#canvas-viewport') || pointers.size || sheet.open) return;
      event.preventDefault(); const point = viewportPoint(event), multiplier = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 300 : 1;
      if (event.ctrlKey || event.metaKey) zoomAt(Math.exp(-event.deltaY * multiplier * .01),point.x,point.y);
      else { camera().x -= (event.shiftKey ? event.deltaY : event.deltaX) * multiplier; camera().y -= (event.shiftKey ? 0 : event.deltaY) * multiplier; applyCamera(); }
    }, { passive:false });
    document.addEventListener('keydown', event => {
      if (!event.target.closest('#canvas-viewport') || sheet.open) return;
      if (event.code === 'Space') { event.preventDefault(); spaceDown = true; }
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) {
        event.preventDefault(); camera().x += event.key === 'ArrowLeft' ? 60 : event.key === 'ArrowRight' ? -60 : 0; camera().y += event.key === 'ArrowUp' ? 60 : event.key === 'ArrowDown' ? -60 : 0; applyCamera();
      }
      if (['+','=','-','0'].includes(event.key)) { event.preventDefault(); if (event.key === '0') fitCanvas(); else zoomCenter(event.key === '-' ? 1 / 1.2 : 1.2); }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); changeDrawingHistory(event.shiftKey); }
    });
    document.addEventListener('keyup', event => { if (event.code === 'Space') spaceDown = false; });
    window.addEventListener('blur', () => {
      spaceDown = false;
      if (!gesture && !pointers.size) return;
      pointers.clear();
      if (gesture?.changed) persist();
      gesture = null; currentStroke = null;
      if (view === 'board') render();
    });
    window.addEventListener('pagehide', () => { try { writeStorage(); } catch { /* Save state remains visible on next edit. */ } });
    render();
  </script>
</body>
</html>
