name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env.dev
      - name: Build services
        run: docker compose -f compose.dev.yaml --env-file .env.dev build
      - name: Start PostgreSQL
        run: docker compose -f compose.dev.yaml --env-file .env.dev up -d --wait db
      - name: Backend checks
        run: |
          docker compose -f compose.dev.yaml --env-file .env.dev run --rm --no-deps backend sh -ec '
            uv run ruff check .
            uv run ruff format --check .
            uv run ty check
            uv run pytest tests
            uv run lint-imports
          '
      - name: Frontend checks
        run: |
          docker compose -f compose.dev.yaml --env-file .env.dev run --rm --no-deps frontend sh -ec '
            pnpm exec vitest run
            pnpm run typecheck
            pnpm exec biome check .
            pnpm run depcruise
            pnpm run build
          '
