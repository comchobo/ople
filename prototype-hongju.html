<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>Ople — 내 삶의 다음 페이지</title>
  <style>
    :root{--paper:#f6f3eb;--ink:#293e35;--muted:#72786c;--line:#dedfd3;--green:#385344;--lime:#dae79e;--work:#dce6d4;--create:#f1dfc3;--people:#e8dbe5;--rest:#d9e5ed}
    *{box-sizing:border-box}body{margin:0;background:#e6e7df;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;line-height:1.65;letter-spacing:-.03em}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button,input,select{min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:4px}button:disabled{opacity:.4;cursor:default}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"AppleMyungjo","Batang",serif;font-weight:500;line-height:1.4;letter-spacing:-.055em}h1{font-size:38px}h2{font-size:29px}h3{font-size:17px;line-height:1.5}small{font-size:11px}svg{display:block}#shell{max-width:460px;min-height:100dvh;margin:auto;background:var(--paper);position:relative;box-shadow:0 0 70px #293e3510}header{display:flex;align-items:center;justify-content:space-between;padding:21px 25px 14px;border-bottom:1px solid var(--line)}.logo{font:italic 35px Georgia,serif;letter-spacing:-3px;padding:0;min-height:44px}.edition{font-size:10px;letter-spacing:.16em;color:var(--muted);text-align:right}.content{padding:30px 25px 32px}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--green);font-weight:650;margin-bottom:16px}.muted{color:var(--muted)}.intro{margin-top:15px;color:var(--muted);line-height:1.85}.primary,.secondary{display:flex;align-items:center;justify-content:center;width:100%;border-radius:4px;padding:15px 18px;min-height:54px;font-weight:600;gap:12px}.primary{background:var(--green);color:#fff}.secondary{border:1px solid #b9c2b1;background:transparent}.text-button{font-size:12px;text-decoration:underline;text-underline-offset:4px;color:var(--muted);padding:8px}.actions{display:grid;gap:10px;margin-top:26px}.rule{height:1px;background:var(--line);margin:25px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{display:inline-block;font-size:10px;border:1px solid #ccd2be;padding:3px 9px;border-radius:20px}.serif{font-family:Georgia,"AppleMyungjo","Batang",serif}.cover{position:relative;margin:30px 0 23px;background:#e0e6d2;border:1px solid #c8cfb8;border-radius:3px 12px 12px 3px;padding:26px 22px 20px 32px;min-height:278px;box-shadow:6px 6px 0 #d8dacd;overflow:hidden}.cover:before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:1px solid #b9c5a3;border-right:1px solid #f6f3eb88;width:4px}.cover-title{font-size:30px;line-height:1.3;position:relative;z-index:1}.cover-caption{font-size:10px;letter-spacing:.15em;margin-top:8px}.cover-art{width:100%;height:132px;margin-top:8px}.cover-bottom{border-top:1px solid #b9c5a3;padding-top:10px;font-size:10px;letter-spacing:.08em}.step-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 12px}.step-list span{font-size:10px;color:var(--muted)}.step-list b{display:block;font-size:12px;font-weight:500;margin-top:3px}footer{padding:14px 25px 22px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}footer button{font-size:10px;min-height:44px;color:var(--muted)}.progress{display:flex;gap:6px;margin:22px 0}.progress i{height:3px;background:var(--line);flex:1}.progress i.on{background:var(--green)}.question{font-size:27px;min-height:118px}.orb{display:flex;align-items:center;justify-content:center;width:150px;height:150px;margin:28px auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#eff2db,#b8c79c 65%,#869d7f);box-shadow:0 0 0 16px #e1e5d255,0 0 0 32px #e1e5d222}.orb svg{width:80px}.listen{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:30px}.mic{width:64px;height:64px;display:grid;place-items:center;background:var(--green);border-radius:50%;color:white}.listen span{font-size:12px;color:var(--muted)}.note{font-size:10px;color:#787b72;text-align:center;margin-top:30px;line-height:1.7}.answer{margin-top:25px}.field{display:block;margin-bottom:18px;font-size:12px;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;margin-top:8px;padding:12px;background:#fffdf7;border:1px solid #cbd0c1;border-radius:4px;font-weight:400}.field textarea{min-height:104px;resize:vertical}.summary-note{padding:15px;border-left:2px solid #a5b779;background:#edf0df;font-size:12px;margin:22px 0}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:23px 0}.tabs button{flex:1;font-size:12px;padding:10px 2px;border-bottom:2px solid transparent;color:var(--muted)}.tabs button[aria-pressed=true]{color:var(--green);border-color:var(--green);font-weight:700}.plan-header{margin:22px 0}.plan-no{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:7px}.plan-desc{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.85}.category{font-size:10px;display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.category span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--color);margin-right:5px}.timeline-frame{border:1px solid var(--line);background:#fffdf780;border-radius:5px;overflow:hidden}.timeline-scroll{overflow-x:auto;overscroll-behavior-x:contain}.timeline-inner{padding:13px 10px}.years{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:10px;color:var(--muted);padding-bottom:12px}.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;gap:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),#e6e7dd calc(20% - 1px),#e6e7dd 20%);padding-bottom:8px}.piece{grid-row:var(--row);grid-column:var(--start)/span var(--duration);background:var(--color);border:1px solid #293e3510;border-radius:3px;margin:4px 3px;padding:9px 7px;font-size:10px;text-align:left;min-height:44px;line-height:1.4;overflow-wrap:anywhere}.piece:before{content:"";display:block;width:12px;border-top:2px solid #53614b66;margin-bottom:5px}.mini{position:relative;display:flex;height:34px;width:100%;min-height:34px;background:#eaeddf;margin-top:10px;border-radius:3px;overflow:hidden}.mini-piece{position:absolute;height:4px;background:#a1b18e;border-radius:2px}.mini-window{position:absolute;top:0;bottom:0;border:1px solid #647d53;background:#ffffff30;pointer-events:none}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.toolbar button{padding:0 12px;font-size:12px}.toolbar small{color:var(--muted)}.overview{display:grid;gap:9px}.overview-card{padding:14px;border:1px solid var(--line);border-radius:4px;background:#fffdf755;text-align:left;width:100%}.overview-card[aria-pressed=true]{border-color:#81936c;background:#edf0df}.overview-card strong{font-size:12px;display:block}.overview-card span{font-size:11px;color:var(--muted)}.overview-card .scores{display:block;margin-top:7px;font-size:10px;color:var(--green)}.assessment{margin-top:28px}.assessment h3{margin-bottom:8px}.rating{padding:13px 0;border-bottom:1px solid var(--line)}.rating label{display:flex;align-items:center;justify-content:space-between;font-size:12px}.rating output{font-size:11px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--green);margin:7px 0 0;min-height:25px}.rating small{color:var(--muted);font-size:10px}.back{font-size:12px;color:var(--muted);padding:0;min-height:44px}.saved{font-size:10px;color:var(--muted)}.complete-stamp{margin:14px 0 24px;display:inline-flex;width:60px;height:60px;border:1px solid #8b9c77;align-items:center;justify-content:center;border-radius:50%;font-size:24px;transform:rotate(-12deg);color:var(--green)}.quote{font-size:20px;line-height:1.7;margin:22px 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-wrap:anywhere}.loading{padding:65px 0;text-align:center}.loading .orb{animation:breathe 2s ease-in-out infinite}.loading p{margin-top:18px;color:var(--muted);font-size:12px}dialog{width:calc(100% - 24px);max-width:436px;max-height:90dvh;padding:24px;border:1px solid var(--line);border-radius:14px 14px 6px 6px;background:var(--paper);color:var(--ink);overflow-y:auto}dialog::backdrop{background:#22362b66;backdrop-filter:blur(3px)}dialog h2{font-size:24px;margin-bottom:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{color:#9c5148}.empty{padding:28px;text-align:center;font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;background:var(--green);color:white;padding:12px 18px;border-radius:6px;font-size:12px;z-index:10}.summary-value{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.summary-values{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-top:18px}.summary-values small{display:block;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}@keyframes breathe{50%{transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:360px){.content{padding:25px 18px}header{padding-left:18px;padding-right:18px}h1{font-size:34px}.tabs{gap:2px}.category{gap:8px}}
  </style>
</head>
<body>
<div id="shell">
  <header><button class="logo" id="home" aria-label="Ople 첫 화면">ople<span style="color:#8ba15b">.</span></button><div class="edition">A LITTLE ROOM<br>FOR YOUR POSSIBILITIES</div></header>
  <main id="app"></main>
  <footer><span>OPLE · LIFE DESIGN JOURNAL</span><button id="reset">데모 초기화</button></footer>
</div>
<dialog id="piece-dialog" aria-labelledby="dialog-title"></dialog>
<div id="announcement" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY='ople-hongju-v1';
const categories={work:{name:'일',color:'var(--work)'},create:{name:'창작',color:'var(--create)'},people:{name:'관계',color:'var(--people)'},rest:{name:'휴식',color:'var(--rest)'}};
const prompts=['요즘, 어떤 순간에\n가장 나답다고 느끼나요?','앞으로의 삶에 꼭 담고 싶은\n경험이 있나요?','새로운 가능성을 펼칠 때,\n지키고 싶은 일상은 무엇인가요?'];
const examples=['작은 아이디어를 내 손으로 만들 때요. 가까운 사람들과 느긋하게 보내는 시간도 소중해요.','나만의 작업을 꾸준히 해보고 싶어요. 낯선 동네에서 한 달쯤 살아보는 것도요.','지금의 수입을 바로 포기하긴 어려워요. 가족과 보내는 시간, 주말의 여유는 지키고 싶어요.'];
const ratingInfo=[['자원','필요한 시간·비용·역량이 충분한가요?'],['호감','이 삶에 얼마나 마음이 끌리나요?'],['자신감','직접 해낼 수 있다고 느끼나요?'],['일관성','내 가치와 원하는 방향에 맞나요?']];
const initial=()=>({screen:'home',question:0,answers:[],summary:[...examples],selected:0,zoom:1,plans:[],completed:false});
let state=initial(),storageAvailable=true,generationTimer;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.plans)&&Array.isArray(saved.answers)&&Array.isArray(saved.summary)&&['home','interview','summary','generating','board','editor','complete'].includes(saved.screen)){state={...initial(),...saved};if(state.screen==='generating')state.screen='summary';if(state.selected<0||state.selected>=Math.max(1,state.plans.length))state.selected=0;if(['board','editor','complete'].includes(state.screen)&&state.plans.length!==3)state=initial();}}catch{storageAvailable=false;}
const app=document.querySelector('#app');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,action,kind='primary')=>`<button class="${kind}" data-action="${action}">${text}</button>`;
const note=()=>'<p class="note">AI 에이전트 체험을 위한 예시 대화와 계획입니다.<br>실제 음성 인식 및 AI 생성은 연결되어 있지 않습니다.</p>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageAvailable=false;}}
function toast(message){const el=document.querySelector('#announcement');el.className='toast';el.textContent=message;setTimeout(()=>{el.className='';el.textContent='';},2400);}
function navigate(screen){clearTimeout(generationTimer);state.screen=screen;save();render();window.scrollTo(0,0);const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
function seedPlans(){
  const data=[
    {title:'익숙한 일상에, 나만의 여백',desc:'지금의 기반은 단단하게. 일의 깊이를 더하면서 창작과 소중한 사람들을 위한 자리를 조금씩 넓혀가는 삶.',question:'지금의 삶에서 무엇을 더 키워보고 싶나요?',pieces:[['work','지금의 일, 한 단계 깊게',1,2],['create','주말의 작은 창작 습관',1,2],['people','소중한 사람들과 정기적인 만남',1,5],['work','나다운 전문성으로 일하기',3,3],['rest','계절마다 짧은 여행',2,4],['create','첫 번째 개인 프로젝트 공개',3,2]]},
    {title:'좋아하는 일이 일상이 된다면',desc:'당장 모든 것을 바꾸기보다 작은 작업부터. 수입의 기반을 지키며 내 작업과 새로운 일의 가능성을 천천히 시험하는 삶.',question:'좋아하는 일을 조금 더 진지하게 해본다면?',pieces:[['work','현재 일과 병행할 여건 만들기',1,2],['create','관심 분야 배우고 작은 작업 공개',1,1],['people','함께 만드는 동료 만나기',2,3],['create','작은 유료 프로젝트로 검증하기',2,2],['work','수입을 살피며 일의 비중 조정',4,2],['rest','주말 하루는 비워두기',1,5]]},
    {title:'다른 풍경에서, 나의 속도로',desc:'어디서 어떻게 살고 싶은지부터 다시 묻기. 관계와 여유를 중심에 두고, 장소와 일의 방식을 작게 바꿔보는 삶.',question:'남의 기준을 잠시 내려놓으면 어떤 하루가 보이나요?',pieces:[['rest','낯선 동네에서 일주일 살아보기',1,1],['work','장소에 덜 묶이는 일 탐색',1,2],['people','함께할 사람과 생활 기준 나누기',1,3],['create','새로운 일상을 기록하기',2,4],['rest','예산 안에서 한 달 살기',3,1],['work','나에게 맞는 생활 기반 정하기',4,2]]}
  ];
  state.plans=data.map((p,i)=>({...p,id:i,ratings:[null,null,null,null],pieces:p.pieces.map(([category,title,start,duration],j)=>({id:`${i}-${j}`,category,title,start,duration,description:''}))}));
}
function art(){return `<svg class="cover-art" viewBox="0 0 300 130" fill="none" aria-hidden="true"><path d="M28 124C28 59 83 53 102 13M135 124C135 80 169 54 149 11M243 124C243 73 208 69 218 14" stroke="#6a8057" stroke-width="1.5"/><path d="M29 105C29 66 54 52 73 51C72 76 55 97 29 105Z" fill="#93a77b"/><path d="M135 94C106 92 89 73 90 54C119 53 134 72 135 94Z" fill="#abbc8e"/><path d="M150 51C174 49 190 29 184 10C164 14 151 29 150 51Z" fill="#7d9665"/><path d="M239 98C262 97 279 78 275 59C254 61 240 76 239 98Z" fill="#a3b383"/><circle cx="99" cy="17" r="12" fill="#f6f3eb"/><circle cx="99" cy="17" r="4" fill="#c2a15c"/><circle cx="218" cy="19" r="13" stroke="#f6f3eb" stroke-width="7"/><path d="M15 125H285" stroke="#92a57b"/></svg>`;}
function renderHome(){return `<div class="content"><p class="eyebrow">YOUR NEXT CHAPTER, NOT THE ONLY ANSWER.</p><h1>하나의 정답 대신,<br>세 가지 나의 미래.</h1><p class="intro">말로 꺼내면 조금 더 선명해지는 마음.<br>AI와 함께, 앞으로 5년의 가능성을 펼쳐보세요.</p><div class="cover"><p class="cover-caption">MY ODYSSEY JOURNAL</p><div class="cover-title serif">아직 펼치지 않은<br>나의 페이지들</div>${art()}<div class="row cover-bottom"><span>WORK · CREATE · CONNECT · REST</span><span>01 — 05</span></div></div><div class="step-list"><div><span>01 / DISCOVER</span><b>나를 이야기하고</b></div><div><span>02 / EXPLORE</span><b>세 미래를 만나고</b></div><div><span>03 / MAKE IT MINE</span><b>내 계획으로 다듬기</b></div></div><div class="actions">${button('내 미래 펼쳐보기','start')}${button('완성된 예시 먼저 보기','example','text-button')}</div><p class="muted" style="text-align:center;font-size:11px;margin-top:14px">잘 정리된 답이 아니어도 괜찮아요.</p></div>`;}
function renderInterview(){const q=state.question;return `<div class="content"><div class="row"><button class="back" data-action="interview-back">← 이전</button><span class="tag">나를 발견하는 대화</span></div><div class="progress">${prompts.map((_,i)=>`<i class="${i<=q?'on':''}"></i>`).join('')}</div><p class="eyebrow">QUESTION 0${q+1} / 03</p><h1 class="question">${prompts[q].replace('\n','<br>')}</h1><div class="orb"><svg viewBox="0 0 80 50" aria-hidden="true"><path d="M10 25V26M20 17V33M30 9V41M40 15V35M50 5V45M60 17V33M70 23V27" stroke="#49623e" stroke-width="3" stroke-linecap="round"/></svg></div><div class="listen"><button class="mic" data-action="speak" aria-label="눌러서 이야기하기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><span>눌러서 편하게 이야기해 주세요</span></div><div id="answer-area" class="answer" ${state.answers[q]?'':'hidden'}><label class="field">나의 답변<textarea id="answer">${esc(state.answers[q]||'')}</textarea></label>${button('이 답변으로 계속','answer')}</div>${note()}</div>`;}
function renderSummary(){return `<div class="content"><button class="back" data-action="summary-back">← 대화로 돌아가기</button><p class="eyebrow" style="margin-top:20px">A PORTRAIT OF YOU</p><h1>이야기 속에서 찾은<br>나의 방향들.</h1><p class="intro">이 마음을 출발점으로 세 미래를 그려볼게요.<br>다르게 느껴지는 부분은 편하게 고쳐주세요.</p><div class="summary-note">하나의 직업보다, 어떤 하루를 살고 싶은지가 중요해요.</div>${['중요한 가치','해보고 싶은 경험','지키고 싶은 현실'].map((label,i)=>`<label class="field">${label}<textarea data-summary="${i}">${esc(state.summary[i])}</textarea></label>`).join('')}${button('세 가지 미래 만들기','generate')}${note()}</div>`;}
function legend(){return `<div class="category">${Object.entries(categories).map(([id,c])=>`<span style="--color:${c.color}">${c.name}</span>`).join('')}</div>`;}
function timeline(editable=false){const p=state.plans[state.selected];return `<div class="timeline-frame"><div class="timeline-scroll" id="timeline-scroll"><div class="timeline-inner" data-testid="timeline" data-zoom="${state.zoom}" style="width:${state.zoom*100}%"><div class="years">${[1,2,3,4,5].map(y=>`<span>${y}년 차</span>`).join('')}</div><div class="track">${p.pieces.length?p.pieces.map((piece,i)=>`<${editable?'button':'div'} ${editable?`data-piece="${esc(piece.id)}"`:''} class="piece" style="--row:${i+1};--start:${piece.start};--duration:${piece.duration};--color:${categories[piece.category].color}">${esc(piece.title)}</${editable?'button':'div'}>`).join(''):'<p class="empty" style="grid-column:1/-1">첫 번째 삶의 조각을 더해보세요.</p>'}</div></div></div></div>${editable?`<button class="mini" id="minimap" aria-label="타임라인 미니맵: 누른 위치로 이동">${p.pieces.map((piece,i)=>`<i class="mini-piece" style="left:${(piece.start-1)*20}%;width:${piece.duration*20}%;top:${4+(i%4)*7}px"></i>`).join('')}<span class="mini-window" style="width:${100/state.zoom}%"></span></button><div class="toolbar"><small>전체 5년 · 조각을 눌러 편집</small><div><button data-action="zoom-out" aria-label="축소" ${state.zoom===1?'disabled':''}>−</button><small>${state.zoom*100}%</small><button data-action="zoom-in" aria-label="확대" ${state.zoom===3?'disabled':''}>＋</button></div></div>`:''}`;}
function scores(p){return p.ratings.map((v,i)=>`${ratingInfo[i][0]} ${v===null?'—':v}`).join(' · ');}
function renderBoard(){const p=state.plans[state.selected];return `<div class="content"><p class="eyebrow">THREE LIVES, ALL YOURS.</p><h1 style="font-size:31px">내 앞에 펼쳐진 세 갈래</h1><p class="intro">정답을 고르는 시간이 아니에요.<br>각각의 삶에서 마음이 움직이는 곳을 찾아보세요.</p><div class="summary-values"><small>내 이야기의 출발점</small><p class="summary-value">${esc(state.summary[0])}</p></div><div class="tabs">${state.plans.map((_,i)=>`<button data-plan="${i}" aria-label="Plan ${i+1} 살펴보기" aria-pressed="${state.selected===i}">Plan ${i+1} <span aria-hidden="true">↗</span></button>`).join('')}</div><div class="plan-header"><p class="plan-no">POSSIBILITY 0${state.selected+1}</p><h2>${esc(p.title)}</h2><p class="plan-desc">${esc(p.desc)}</p></div>${legend()}${timeline()}<div class="summary-note">${esc(p.question)}</div>${button('이 계획 다듬기','edit')}<div class="rule"></div><div class="row"><h3>세 미래 한눈에</h3><small class="muted">자기평가 · 0–10</small></div><div class="overview" style="margin-top:14px">${state.plans.map((plan,i)=>`<button class="overview-card" data-plan="${i}" aria-pressed="${state.selected===i}" aria-label="Plan ${i+1} 비교"><strong>0${i+1} · ${esc(plan.title)}</strong><span>${plan.pieces.length}개의 조각 · 5년의 이야기</span><span class="scores">${scores(plan)}</span></button>`).join('')}</div>${note()}</div>`;}
function renderEditor(){const p=state.plans[state.selected];return `<div class="content"><div class="row"><button class="back" data-action="board">← 세 계획 보기</button><span class="saved">${storageAvailable?'이 기기에 자동 저장':'저장 불가 · 현재 화면에서만 유지'}</span></div><div class="plan-header"><p class="eyebrow">MAKE IT YOURS / PLAN 0${state.selected+1}</p><h1 style="font-size:29px">${esc(p.title)}</h1><p class="plan-desc">계획은 언제든 바뀌어도 괜찮아요.<br>내 마음에 맞는 조각으로 다듬어보세요.</p></div>${legend()}${timeline(true)}<div style="margin-top:16px">${button('＋ 조각 추가','add','secondary')}</div><section class="assessment"><h3>이 삶을 상상하면, 나는</h3><p class="muted" style="font-size:12px">AI의 점수 대신, 지금 나의 느낌을 남겨요.</p>${ratingInfo.map(([label,desc],i)=>`<div class="rating"><label for="rating-${i}">${label}<output id="score-${i}">${p.ratings[i]===null?'아직 평가하지 않았어요':p.ratings[i]+' / 10'}</output></label><input id="rating-${i}" aria-label="${label} 점수" type="range" min="0" max="10" step="1" value="${p.ratings[i]??5}" data-rating="${i}"><small>${desc}</small></div>`).join('')}</section><div class="actions">${button('보드 완성하기','complete')}</div></div>`;}
function renderComplete(){const p=state.plans[state.selected];return `<div class="content"><div class="complete-stamp" aria-hidden="true">✓</div><p class="eyebrow">A NEW PAGE BEGINS.</p><h1>내 삶의 다음 페이지</h1><p class="intro">하나의 정답이 아닌, 내가 그려본 가능성.<br>오늘의 마음을 여기에 잘 담아두었어요.</p><div class="cover" style="min-height:0"><p class="cover-caption">MY ODYSSEY JOURNAL / PLAN 0${state.selected+1}</p><h2 style="margin-top:14px">${esc(p.title)}</h2>${art()}<div class="cover-bottom">${p.pieces.length} PIECES · 5 YEARS · YOUR OWN PACE</div></div>${legend()}${timeline()}<p class="quote serif">“${esc(state.summary[0])}”</p><p class="muted" style="font-size:12px">계획은 약속이 아니라 나침반이에요.<br>마음이 달라지면 언제든 다시 펼쳐보세요.</p><div class="actions">${button('계속 다듬기','edit')}${button('다른 가능성도 살펴보기','board','secondary')}</div><p class="note">${storageAvailable?'이 브라우저에 저장되어 있어요. 다음에 다시 펼쳐도 이어집니다.':'브라우저 저장이 제한되어 현재 창에서만 유지됩니다.'}</p></div>`;}
function render(){const views={home:renderHome,interview:renderInterview,summary:renderSummary,board:renderBoard,editor:renderEditor,complete:renderComplete,generating:()=>`<div class="content loading"><p class="eyebrow">CONNECTING YOUR POSSIBILITIES</p><div class="orb" aria-hidden="true">✧</div><h1 style="font-size:30px">당신의 이야기로<br>세 미래를 펼치는 중</h1><p role="status">가치와 바람, 지키고 싶은 일상을 연결하고 있어요.</p>${note()}</div>`};app.innerHTML=views[state.screen]();bindTimeline();}
function bindTimeline(){const scroll=document.querySelector('#timeline-scroll'),mini=document.querySelector('#minimap');if(!scroll||!mini)return;const update=()=>{mini.querySelector('.mini-window').style.left=`${scroll.scrollLeft/scroll.scrollWidth*100}%`;};scroll.addEventListener('scroll',update);mini.addEventListener('click',e=>{const rect=mini.getBoundingClientRect();scroll.scrollLeft=(e.clientX-rect.left)/rect.width*scroll.scrollWidth-scroll.clientWidth/2;});}
function showPiece(id){const p=state.plans[state.selected];const piece=p.pieces.find(item=>item.id===id)||{id:null,title:'',description:'',category:'create',start:1,duration:1};const dialog=document.querySelector('#piece-dialog');dialog.innerHTML=`<form id="piece-form"><div class="row"><h2 id="dialog-title">${piece.id?'삶의 조각 다듬기':'새로운 삶의 조각'}</h2><button type="button" class="back" data-action="close-dialog">닫기</button></div><label class="field">조각 제목<input name="title" required maxlength="60" value="${esc(piece.title)}" placeholder="어떤 경험을 담고 싶나요?"></label><label class="field">영역<select name="category">${Object.entries(categories).map(([key,c])=>`<option value="${key}" ${key===piece.category?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field">조각 메모<textarea name="description" maxlength="500" placeholder="나에게 어떤 의미인지, 어떻게 시작할지">${esc(piece.description)}</textarea></label><div class="two"><label class="field">시작 연차<select name="start">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===piece.start?'selected':''}>${n}년 차</option>`).join('')}</select></label><label class="field">기간<select name="duration"></select></label></div><button type="submit" class="primary">조각 저장</button>${piece.id?`<div class="row" style="margin-top:12px"><button type="button" data-action="duplicate" data-id="${esc(piece.id)}">복제</button><button type="button" class="danger" data-action="delete" data-id="${esc(piece.id)}">삭제</button></div>`:''}</form>`;const form=dialog.querySelector('form');const duration=form.elements.duration;const updateDuration=()=>{const old=Number(duration.value)||piece.duration;const max=6-Number(form.elements.start.value);duration.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1}년</option>`).join('');duration.value=String(Math.min(old,max));};updateDuration();form.elements.start.onchange=updateDuration;form.onsubmit=e=>{e.preventDefault();if(!form.elements.title.value.trim()){form.elements.title.setCustomValidity('제목을 입력해주세요.');form.elements.title.reportValidity();return;}const next={id:piece.id||cryptoId(),title:form.elements.title.value.trim(),description:form.elements.description.value.trim(),category:form.elements.category.value,start:Number(form.elements.start.value),duration:Number(duration.value)};if(piece.id)p.pieces[p.pieces.findIndex(item=>item.id===piece.id)]=next;else p.pieces.push(next);dialog.close();save();render();toast('삶의 조각을 저장했어요.');};form.elements.title.oninput=()=>form.elements.title.setCustomValidity('');dialog.showModal();}
function cryptoId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;}
document.addEventListener('input',e=>{const target=e.target;if(target.id==='answer'){state.answers[state.question]=target.value;save();}if(target.dataset.summary!==undefined){state.summary[Number(target.dataset.summary)]=target.value;save();}if(target.dataset.rating!==undefined){const i=Number(target.dataset.rating);state.plans[state.selected].ratings[i]=Number(target.value);document.querySelector(`#score-${i}`).textContent=`${target.value} / 10`;save();}});
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.plan!==undefined){state.selected=Number(target.dataset.plan);state.zoom=1;save();render();return;}if(target.dataset.piece){showPiece(target.dataset.piece);return;}const action=target.dataset.action;const p=state.plans[state.selected];switch(action){case'start':state.question=Math.min(state.question,2);navigate('interview');break;case'example':state.summary=[...examples];if(!state.plans.length)seedPlans();navigate('board');break;case'speak':state.answers[state.question]=state.answers[state.question]||examples[state.question];save();render();document.querySelector('#answer').focus();break;case'answer':{const answer=document.querySelector('#answer').value.trim();if(!answer){toast('한 문장이라도 좋아요. 마음을 들려주세요.');break;}state.answers[state.question]=answer;state.summary[state.question]=answer;if(state.question<2){state.question++;navigate('interview');}else navigate('summary');break;}case'interview-back':if(state.question>0){state.question--;navigate('interview');}else navigate('home');break;case'summary-back':state.question=2;navigate('interview');break;case'generate':if(state.summary.some(v=>!v.trim())){toast('세 가지 이야기를 조금씩 채워주세요.');break;}navigate('generating');generationTimer=setTimeout(()=>{seedPlans();state.selected=0;state.zoom=1;navigate('board');},1800);break;case'board':state.zoom=1;navigate('board');break;case'edit':navigate('editor');break;case'complete':state.completed=true;state.zoom=1;navigate('complete');break;case'add':showPiece();break;case'close-dialog':document.querySelector('#piece-dialog').close();break;case'duplicate':{const original=p.pieces.find(item=>item.id===target.dataset.id);p.pieces.push({...original,id:cryptoId(),title:original.title+' (복사)'});document.querySelector('#piece-dialog').close();save();render();toast('조각을 복제했어요.');break;}case'delete':p.pieces=p.pieces.filter(item=>item.id!==target.dataset.id);document.querySelector('#piece-dialog').close();save();render();toast('조각을 삭제했어요.');break;case'zoom-in':state.zoom=Math.min(3,state.zoom+1);save();render();break;case'zoom-out':state.zoom=Math.max(1,state.zoom-1);save();render();break;}});
document.querySelector('#home').onclick=()=>navigate('home');
document.querySelector('#reset').onclick=()=>{if(confirm('이 기기에 저장된 대화와 계획을 지우고 처음부터 시작할까요?')){clearTimeout(generationTimer);document.querySelector('#piece-dialog').close();state=initial();save();navigate('home');}};
render();
</script>
</body>
</html>
